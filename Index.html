<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mess Management System</title>
  <!-- Font Awesome 6.5.2 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #0f172a;
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #dc2626;
      --sidebar-width: 260px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* AUTH / LOGIN SCREEN */
    #login-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .login-card {
      background: #ffffff; width: 100%; max-width: 420px; padding: 2.5rem; border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); text-align: center; position: relative;
    }
    .login-header i { font-size: 3rem; color: var(--primary); margin-bottom: 0.5rem; }
    .login-header h2 { font-size: 1.5rem; color: var(--secondary); margin-bottom: 0.25rem; }
    .login-header p { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.5rem; }
    
    .form-group { margin-bottom: 1.25rem; text-align: left; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem; }
    .form-control {
      width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: 6px;
      font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    .form-control:focus { border-color: var(--primary); }
    .btn {
      width: 100%; padding: 0.75rem 1rem; border: none; border-radius: 6px; font-weight: 600;
      cursor: pointer; transition: background-color 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-primary { background-color: var(--primary); color: #fff; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: var(--secondary); color: #fff; }
    .btn-sm { padding: 0.4rem 0.75rem; font-size: 0.85rem; width: auto; }
    .btn-danger { background-color: var(--danger); color: #fff; }
    .btn-success { background-color: var(--success); color: #fff; }

    /* LAYOUT ARCHITECTURE */
    #app-container { display: flex; width: 100vw; height: 100vh; overflow: hidden; width: 100%; }
    
    /* SIDEBAR */
    .sidebar {
      width: var(--sidebar-width); background-color: var(--secondary); color: #fff;
      display: flex; flex-direction: column; justify-content: space-between; transition: all 0.3s ease;
      z-index: 100;
    }
    .sidebar-brand { padding: 1.25rem; display: flex; align-items: center; gap: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sidebar-brand i { font-size: 1.5rem; color: var(--primary); }
    .sidebar-brand h3 { font-size: 1.1rem; font-weight: 600; color: #fff; }
    .sidebar-menu { list-style: none; padding: 1rem 0; overflow-y: auto; flex-grow: 1; }
    .sidebar-menu li a {
      display: flex; align-items: center; gap: 0.85rem; padding: 0.85rem 1.5rem; color: #94a3b8;
      text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: all 0.2s;
    }
    .sidebar-menu li a:hover, .sidebar-menu li.active a { color: #ffffff; background-color: rgba(255, 255, 255, 0.08); border-left: 4px solid var(--primary); }

    /* MAIN CONTENT */
    .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    
    /* TOP HEADER */
    .top-header {
      height: 64px; background-color: #ffffff; border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem;
    }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    .mobile-toggle { display: none; font-size: 1.25rem; cursor: pointer; color: var(--text-main); }
    .page-title { font-size: 1.25rem; font-weight: 600; color: var(--secondary); }
    .header-right { display: flex; align-items: center; gap: 1.25rem; }
    .user-profile { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .user-info { display: flex; flex-direction: column; text-align: right; }
    .user-name { font-size: 0.875rem; font-weight: 600; }
    .user-role { font-size: 0.75rem; color: var(--text-muted); }

    /* CONTENT BODY */
    .content-body { flex: 1; padding: 1.5rem; overflow-y: auto; background-color: var(--bg-body); }

    /* CARDS & KPI GRID */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }
    .kpi-card { background: var(--card-bg); padding: 1.25rem; border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .kpi-info h4 { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.25rem; }
    .kpi-info h2 { font-size: 1.5rem; font-weight: 700; color: var(--secondary); }
    .kpi-icon { width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
    .bg-blue { background: #dbeafe; color: #2563eb; }
    .bg-green { background: #dcfce7; color: #16a34a; }
    .bg-yellow { background: #fef3c7; color: #d97706; }
    .bg-red { background: #fee2e2; color: #dc2626; }

    /* CHARTS & TABLES */
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }
    .panel-card { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); padding: 1.25rem; margin-bottom: 1.5rem; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem; }
    .panel-title { font-size: 1rem; font-weight: 600; color: var(--secondary); }

    .table-responsive { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
    th { background-color: #f1f5f9; padding: 0.75rem 1rem; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border-color); }
    td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
    tr:hover { background-color: #f8fafc; }

    .badge { padding: 0.25rem 0.6rem; border-radius: 50px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
    .badge-success { background: #dcfce7; color: #15803d; }
    .badge-warning { background: #fef3c7; color: #b45309; }
    .badge-danger { background: #fee2e2; color: #b91c1c; }
    .badge-info { background: #e0f2fe; color: #0369a1; }

    /* MODAL */
    .modal-overlay { position: fixed; top:0; left:0; width:100vw; height:100vh; background: rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; z-index: 1000; }
    .modal-card { background: #fff; width: 100%; max-width: 550px; border-radius: 8px; padding: 1.5rem; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .modal-close { cursor: pointer; font-size: 1.2rem; color: var(--text-muted); }

    /* TOAST */
    #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { background: var(--secondary); color: #fff; padding: 0.85rem 1.25rem; border-radius: 6px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem; }

    /* FOOTER */
    .app-footer { text-align: center; padding: 1rem; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border-color); background: #fff; }

    /* RESPONSIVE */
    @media (max-width: 991px) {
      .sidebar { position: fixed; left: -260px; height: 100%; }
      .sidebar.open { left: 0; }
      .mobile-toggle { display: block; }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN -->
  <div id="login-container">
    <div class="login-card">
      <div class="login-header">
        <i class="fa-solid fa-utensils"></i>
        <h2>Mess Management System</h2>
        <p>Digital Mess Administration Platform</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="admin@mess.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-login">
          <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>
      </form>
      <div style="margin-top: 1.5rem; font-size: 0.75rem; color: var(--text-muted);">
        developed by Prince Kumar
      </div>
    </div>
  </div>

  <!-- 2. MAIN APPLICATION LAYOUT -->
  <div id="app-container" style="display: none;">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div>
        <div class="sidebar-brand">
          <i class="fa-solid fa-utensils"></i>
          <h3>Mess Admin</h3>
        </div>
        <ul class="sidebar-menu" id="sidebar-menu">
          <!-- Dynamically generated based on user role -->
        </ul>
      </div>
      <div style="padding: 1rem; font-size: 0.75rem; color: #64748b; text-align: center;">
        developed by Prince Kumar
      </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      <!-- TOP HEADER -->
      <header class="top-header">
        <div class="header-left">
          <i class="fa-solid fa-bars mobile-toggle" id="mobile-toggle"></i>
          <span class="page-title" id="page-title">Dashboard</span>
        </div>
        <div class="header-right">
          <div class="user-profile">
            <img src="" id="header-avatar" class="user-avatar" alt="User">
            <div class="user-info">
              <span class="user-name" id="header-user-name">User Name</span>
              <span class="user-role" id="header-user-role">Role</span>
            </div>
          </div>
          <button class="btn btn-sm btn-secondary" onclick="logout()"><i class="fa-solid fa-power-off"></i></button>
        </div>
      </header>

      <!-- CONTENT BODY (SPA VIEWS) -->
      <main class="content-body" id="content-body">
        <!-- Dynamic views will be injected here -->
      </main>

      <!-- FOOTER -->
      <footer class="app-footer">
        Mess Management System &copy; 2026 | <strong>developed by Prince Kumar</strong>
      </footer>
    </div>
  </div>

  <!-- GLOBAL MODAL -->
  <div class="modal-overlay" id="global-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title" class="panel-title">Modal Title</h3>
        <i class="fa-solid fa-xmark modal-close" onclick="closeModal()"></i>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-container"></div>

  <!-- FRONTEND LOGIC -->
  <script>
    // ==========================================
    // 1. API SERVER WRAPPER
    // ==========================================
    const API = {
      call(functionName, ...args) {
        return new Promise((resolve, reject) => {
          if (typeof google === 'undefined' || !google.script || !google.script.run) {
            reject(new Error('Google Apps Script environment not detected.'));
            return;
          }
          google.script.run
            .withSuccessHandler(response => resolve(response))
            .withFailureHandler(err => reject(err))[functionName](...args);
        });
      }
    };

    // Global State
    const AppState = {
      token: localStorage.getItem('mess_session_token') || null,
      user: null,
      activeView: 'dashboard',
      charts: {}
    };

    // ==========================================
    // 2. INITIALIZATION & ROUTING
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      initApp();
      
      document.getElementById('login-form').addEventListener('submit', handleLogin);
      document.getElementById('mobile-toggle').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
      });
    });

    async function initApp() {
      if (AppState.token) {
        try {
          const res = await API.call('getDashboardData', AppState.token);
          if (res.success) {
            AppState.user = res.data.user;
            renderApp();
            return;
          }
        } catch (e) {
          console.error(e);
        }
      }
      showLogin();
    }

    function showLogin() {
      document.getElementById('login-container').style.display = 'flex';
      document.getElementById('app-container').style.display = 'none';
    }

    function renderApp() {
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('app-container').style.display = 'flex';
      
      document.getElementById('header-user-name').innerText = AppState.user.name;
      document.getElementById('header-user-role').innerText = AppState.user.role;
      document.getElementById('header-avatar').src = AppState.user.profileImage;

      renderSidebarMenu();
      navigateTo('dashboard');
    }

    function renderSidebarMenu() {
      const role = AppState.user.role;
      const menuContainer = document.getElementById('sidebar-menu');
      let items = [];

      if (role === 'Admin') {
        items = [
          { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
          { id: 'students', label: 'Students', icon: 'fa-user-graduate' },
          { id: 'managers', label: 'Managers', icon: 'fa-user-tie' },
          { id: 'menu', label: 'Menu Planning', icon: 'fa-utensils' },
          { id: 'attendance', label: 'Attendance', icon: 'fa-clipboard-user' },
          { id: 'bills', label: 'Billing', icon: 'fa-file-invoice-dollar' },
          { id: 'payments', label: 'Payments', icon: 'fa-money-bill-wave' },
          { id: 'inventory', label: 'Inventory', icon: 'fa-boxes-stacked' },
          { id: 'expenses', label: 'Expenses', icon: 'fa-receipt' },
          { id: 'complaints', label: 'Complaints', icon: 'fa-triangle-exclamation' },
          { id: 'notices', label: 'Notice Board', icon: 'fa-bullhorn' },
          { id: 'settings', label: 'Settings', icon: 'fa-sliders' },
          { id: 'logs', label: 'Activity Logs', icon: 'fa-list-check' }
        ];
      } else if (role === 'Manager') {
        items = [
          { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
          { id: 'menu', label: 'Daily Menu', icon: 'fa-utensils' },
          { id: 'attendance', label: 'Attendance', icon: 'fa-clipboard-user' },
          { id: 'inventory', label: 'Stock & Inventory', icon: 'fa-boxes-stacked' },
          { id: 'expenses', label: 'Expenses', icon: 'fa-receipt' },
          { id: 'complaints', label: 'Complaints', icon: 'fa-triangle-exclamation' },
          { id: 'notices', label: 'Notices', icon: 'fa-bullhorn' }
        ];
      } else if (role === 'Student') {
        items = [
          { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
          { id: 'student-menu', label: 'Weekly Menu', icon: 'fa-utensils' },
          { id: 'student-attendance', label: 'My Attendance', icon: 'fa-calendar-check' },
          { id: 'student-bills', label: 'My Bills & Dues', icon: 'fa-file-invoice' },
          { id: 'student-complaints', label: 'My Complaints', icon: 'fa-comment-dots' },
          { id: 'notices', label: 'Notice Board', icon: 'fa-bullhorn' }
        ];
      }

      menuContainer.innerHTML = items.map(item => `
        <li id="nav-${item.id}">
          <a href="#" onclick="navigateTo('${item.id}'); return false;">
            <i class="fa-solid ${item.icon}"></i> ${item.label}
          </a>
        </li>
      `).join('');
    }

    function navigateTo(viewId) {
      AppState.activeView = viewId;
      document.querySelectorAll('.sidebar-menu li').forEach(li => li.classList.remove('active'));
      const activeNav = document.getElementById('nav-' + viewId);
      if (activeNav) activeNav.classList.add('active');

      const content = document.getElementById('content-body');
      content.innerHTML = `<div style="text-align:center; padding: 3rem;"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><p style="margin-top:1rem;">Loading view...</p></div>`;

      // Route Dispatcher
      if (viewId === 'dashboard') loadDashboardView();
      else if (viewId === 'students') loadStudentsView();
      else if (viewId === 'managers') loadManagersView();
      else if (viewId === 'menu' || viewId === 'student-menu') loadMenuView();
      else if (viewId === 'attendance' || viewId === 'student-attendance') loadAttendanceView();
      else if (viewId === 'bills' || viewId === 'student-bills') loadBillsView();
      else if (viewId === 'inventory') loadInventoryView();
      else if (viewId === 'expenses') loadExpensesView();
      else if (viewId === 'complaints' || viewId === 'student-complaints') loadComplaintsView();
      else if (viewId === 'notices') loadNoticesView();
      else if (viewId === 'settings') loadSettingsView();
      else if (viewId === 'logs') loadLogsView();
      else if (viewId === 'payments') loadPaymentsView();
    }

    // ==========================================
    // 3. AUTH LOGIC
    // ==========================================
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Logging in...`;

      try {
        const res = await API.call('login', email, password);
        if (res.success) {
          localStorage.setItem('mess_session_token', res.data.token);
          AppState.token = res.data.token;
          AppState.user = res.data.user;
          showToast('✓ Welcome back, ' + AppState.user.name);
          renderApp();
        } else {
          showToast('✕ ' + res.message, 'danger');
        }
      } catch (err) {
        showToast('✕ ' + err.message, 'danger');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Login`;
      }
    }

    async function logout() {
      if (AppState.token) {
        await API.call('logout', AppState.token);
      }
      localStorage.removeItem('mess_session_token');
      AppState.token = null;
      AppState.user = null;
      showLogin();
      showToast('ℹ Logged out successfully');
    }

    // ==========================================
    // 4. VIEW LOADERS
    // ==========================================

    // DASHBOARD VIEW
    async function loadDashboardView() {
      document.getElementById('page-title').innerText = 'Dashboard Overview';
      const content = document.getElementById('content-body');

      try {
        const res = await API.call('getDashboardData', AppState.token);
        if (!res.success) return showToast('✕ ' + res.message, 'danger');

        const data = res.data;

        if (AppState.user.role === 'Admin' || AppState.user.role === 'Manager') {
          const kpis = data.kpis;
          content.innerHTML = `
            <div class="kpi-grid">
              <div class="kpi-card">
                <div class="kpi-info"><h4>Total Students</h4><h2>${kpis.totalStudents}</h2></div>
                <div class="kpi-icon bg-blue"><i class="fa-solid fa-user-graduate"></i></div>
              </div>
              <div class="kpi-card">
                <div class="kpi-info"><h4>Today's Meals</h4><h2>${kpis.todayMeals.total}</h2></div>
                <div class="kpi-icon bg-green"><i class="fa-solid fa-utensils"></i></div>
              </div>
              <div class="kpi-card">
                <div class="kpi-info"><h4>Monthly Revenue</h4><h2>₹${kpis.totalRevenue}</h2></div>
                <div class="kpi-icon bg-yellow"><i class="fa-solid fa-indian-rupee-sign"></i></div>
              </div>
              <div class="kpi-card">
                <div class="kpi-info"><h4>Pending Complaints</h4><h2>${kpis.pendingComplaints}</h2></div>
                <div class="kpi-icon bg-red"><i class="fa-solid fa-triangle-exclamation"></i></div>
              </div>
            </div>

            <div class="grid-2">
              <div class="panel-card">
                <div class="panel-header"><span class="panel-title">Revenue vs Expense Analytics</span></div>
                <canvas id="chartRevenue" height="200"></canvas>
              </div>
              <div class="panel-card">
                <div class="panel-header"><span class="panel-title">Today's Meal Attendance</span></div>
                <canvas id="chartAttendance" height="200"></canvas>
              </div>
            </div>
          `;

          initAdminCharts();
        } else {
          // Student Dashboard
          const sk = data.studentKpis;
          content.innerHTML = `
            <div class="kpi-grid">
              <div class="kpi-card">
                <div class="kpi-info"><h4>My Attendance</h4><h2>${sk.attendancePercentage}</h2></div>
                <div class="kpi-icon bg-green"><i class="fa-solid fa-calendar-check"></i></div>
              </div>
              <div class="kpi-card">
                <div class="kpi-info"><h4>Current Due</h4><h2>₹${sk.currentDue}</h2></div>
                <div class="kpi-icon bg-red"><i class="fa-solid fa-file-invoice-dollar"></i></div>
              </div>
            </div>

            <div class="panel-card">
              <div class="panel-header"><span class="panel-title">🍽️ Today's Served Menu</span></div>
              <div class="kpi-grid">
                ${data.todayMenu.length > 0 ? data.todayMenu.map(m => `
                  <div style="background:#f8fafc; padding:1rem; border-radius:6px; border:1px solid #e2e8f0;">
                    <strong style="color:var(--primary);">${m.MealType}</strong>
                    <p style="margin-top:0.5rem; font-size:0.9rem;">${m.Items}</p>
                  </div>
                `).join('') : '<p style="color:var(--text-muted);">No menu updated for today yet.</p>'}
              </div>
            </div>
          `;
        }
      } catch (err) {
        showToast('✕ Error loading dashboard: ' + err.message, 'danger');
      }
    }

    // STUDENTS VIEW
    async function loadStudentsView() {
      document.getElementById('page-title').innerText = 'Student Management';
      const content = document.getElementById('content-body');

      content.innerHTML = `
        <div class="panel-card">
          <div class="panel-header">
            <span class="panel-title">All Registered Students</span>

      document.getElementById('modal-body').innerHTML = bodyHtml;

    function closeModal() {
      document.getElementById('global-modal').style.display = 'none';

      openModal('Add New Student', `
        <form onsubmit="submitStudent(event)">
          <div class="form-group"><label>Full Name</label><input type="text" id="m-s-name" class="form-control" required></div>

    async function submitStudent(e) {
      e.preventDefault();
      const name = document.getElementById('m-s-name').value;
      const email = document.getElementById('m-s-email').value;
      const rollNo = document.getElementById('m-s-roll').value;
      const hostel = document.getElementById('m-s-hostel').value;

      try {
        const res = await API.call('createStudent', AppState.token, { name, email, rollNo, hostel });

          closeModal();
          loadStudentsView();

    async function submitRecordPayment(e, billId) {
      e.preventDefault();
      const amount = document.getElementById('m-p-amount').value;
      const paymentMethod = document.getElementById('m-p-method').value;

      try {
        const res = await API.call('recordPayment', AppState.token, { billId, amount, paymentMethod });
        if (res.success) {
          showToast('✓ Payment recorded successfully');

    // ==========================================
    // 6. CHARTS & UTILITIES
    // ==========================================
    async function initAdminCharts() {
      try {
        const repRes = await API.call('getReports', AppState.token, 'RevenueVsExpenses');
        if (repRes.success) {
          const ctxRev = document.getElementById('chartRevenue').getContext('2d');
          if (AppState.charts.rev) AppState.charts.rev.destroy();
          AppState.charts.rev = new Chart(ctxRev, {
            type: 'bar',
            data: {
              labels: repRes.data.labels,
              datasets: [
                { label: 'Revenue (₹)', data: repRes.data.revenue, backgroundColor: '#2563eb' },
                { label: 'Expenses (₹)', data: repRes.data.expenses, backgroundColor: '#dc2626' }
              ]
            },
            options: { responsive: true, maintainAspectRatio: false }
          });
        }

        const mealRes = await API.call('getReports', AppState.token, 'MealDistribution');
        if (mealRes.success) {
          const ctxAtt = document.getElementById('chartAttendance').getContext('2d');
          if (AppState.charts.att) AppState.charts.att.destroy();
          AppState.charts.att = new Chart(ctxAtt, {
            type: 'doughnut',
            data: {
              labels: mealRes.data.labels,
              datasets: [{
                data: mealRes.data.counts,
                backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6']
              }]
            },
            options: { responsive: true, maintainAspectRatio: false }
          });
        }
      } catch (e) {
        console.error(e);
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      if (type === 'danger') toast.style.background = '#dc2626';
      toast.innerHTML = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }
  </script>
